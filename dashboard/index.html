<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EngineeringOS Control Room</title>
<style>body{font-family:system-ui;margin:24px;background:#0b0d10;color:#e8eaed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#15191f;border:1px solid #29313b;border-radius:12px;padding:16px}.ok{color:#73d99b}.warn{color:#f3c969}.bad{color:#ff7b7b}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #29313b;text-align:left}code{color:#9cc3ff}.flow{display:flex;gap:8px;flex-wrap:wrap}.node{padding:8px 12px;border:1px solid #3b4654;border-radius:999px}</style>
<h1>EngineeringOS · Control Room</h1><p id="meta">Loading snapshot…</p><div class="grid" id="metrics"></div>
<h2>Control loop</h2><div class="flow"><span class="node">Evidence</span><span>→</span><span class="node">Reconciliation</span><span>→</span><span class="node">Policy</span><span>→</span><span class="node">Manager</span><span>→</span><span class="node">Queue</span><span>→</span><span class="node">Scheduler</span><span>→</span><span class="node">Assurance</span><span>→</span><span class="node">Closure</span></div>
<h2>Work queue</h2><table><thead><tr><th>P</th><th>State</th><th>Work</th><th>Assurance</th></tr></thead><tbody id="queue"></tbody></table>
<script>fetch('./snapshot.json').then(r=>r.json()).then(d=>{meta.textContent=`${d.target} · ${d.observed_at} · ${d.mode}`;let cards=[['Qualification',d.manager_summary.qualification],['Production verification',d.manager_summary.production_verification],['Source ↔ production',d.manager_summary.source_production_policy],['Dispatchable',d.dispatchable_count],['Execution authorized',d.execution_authorized]];metrics.innerHTML=cards.map(x=>`<div class=card><small>${x[0]}</small><h2>${x[1]}</h2></div>`).join('');return fetch('./queue.json')}).then(r=>r.json()).then(q=>queue.innerHTML=q.items.map(x=>`<tr><td>P${x.priority}</td><td>${x.state}</td><td>${x.kind}<br><small>${x.reason}</small></td><td>${x.required_assurance}</td></tr>`).join('')).catch(e=>meta.textContent='Snapshot unavailable: '+e)</script>
